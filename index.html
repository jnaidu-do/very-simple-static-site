<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Website</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { max-width: 40ch; color: #94a3b8; margin-bottom: 2rem; }
    a.button {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      text-decoration: none;
      transition: background 150ms ease;
    }
    a.button:hover { background: #7dd3fc; }
    footer { position: fixed; bottom: 1rem; font-size: 0.8rem; color: #475569; }
  </style>
</head>
<body>
  <h1>Hello, World! 👋</h1>
  <p>This is a simple static website. Edit <code>index.html</code> to make it your own.</p>
  <a class="button" href="#about">Get Started</a>
  <footer>Built with plain HTML &amp; CSS</footer>
</body>
</html>
